[project]
name = "dataguard-ai"
version = "1.0.0"
description = "Stammdaten-Copilot: Datenqualität, Dubletten und S/4HANA-Readiness für Kreditoren und Debitoren – RheinMain Controlling-Suite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sherwan Shweish" }]
# Agenten-Standard v1: eine Quelle für Abhängigkeiten (uv); requirements.txt bleibt für pip-Nutzer synchron.
dependencies = [
    # Kern
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",           # Ähnlichkeitsmaße der Dublettenerkennung (token_sort_ratio, ratio)
    # LLM-Anbieter (optional – ohne Schlüssel läuft der Offline-Modus)
    "anthropic>=0.60",
    "google-genai>=1.20",
    # Daten, Cockpit & Export
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.50",          # Theme-Schriften, segmented_control, st.html, Altair width="stretch"
    "altair>=5.4",              # interaktive Diagramme im Designsystem
    "pyarrow>=16",              # erste Version, die mit NumPy 2 kompatibel ist (Datenübergabe an Streamlit)
    "pillow>=10.0",
    "openpyxl>=3.1",
    "reportlab>=4.2",           # Readiness-Bericht als PDF (nur freigegebene Kommentare)
    "python-pptx>=1.0",         # Readiness-Bericht als PowerPoint
    "matplotlib>=3.8",          # Diagramme des Readiness-Berichts (IBCS), DejaVu-Schrift für das PDF
    # Desktop-App (Agenten-Standard v1, nur macOS)
    "pywebview>=5.3; sys_platform == 'darwin'",
]

[dependency-groups]
# python-stdnum nur als Gegentest der IBAN-/USt-IdNr.-Prüfungen – keine Laufzeitabhängigkeit
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "python-stdnum>=1.20",
    "pypdf>=6.21.4",
]

[tool.uv]
package = false          # Anwendung, kein Bibliothekspaket – uv installiert nur die Abhängigkeiten

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
    "invariante: fachliche Invariante (Summen, Reproduzierbarkeit, Kontrollwerte der Suite)",
    "laufzeit: Laufzeitmessung (Grenzwerte großzügig, Messwert wird ausgegeben)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["static", "data"]

[tool.ruff.lint]
# wie VarianceAI, zusätzlich E501 (Zeilenlänge 120) – Vorgabe der Endkontrolle
select = ["F", "E9", "E501", "B", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
# Designsystem 1:1 aus VarianceAI/FlowAudit-AI übernommen (bewusst unverändert, dort ohne Zeilenlängenregel)
"src/ui_design.py" = ["E501"]
# Markdown-Vorlagen (Tabellenzeilen) – Zeilenumbrüche würden die erzeugten Dokumente verändern
"tools/doku_erzeugen.py" = ["E501"]
